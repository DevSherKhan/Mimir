name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tag and protected branch
        shell: bash
        run: |
          package_version="$(node --input-type=commonjs -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must match package version v${package_version}." >&2
            exit 1
          fi
          if ! git branch --remotes --contains "${GITHUB_SHA}" | grep --quiet --fixed-strings "origin/main"; then
            echo "Release commit must be reachable from origin/main." >&2
            exit 1
          fi
      - name: Set up tested Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
        env:
          SCARF_ANALYTICS: "false"
      - name: Verify release contents
        run: npm run release:check
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Publish
        run: npm publish --ignore-scripts
