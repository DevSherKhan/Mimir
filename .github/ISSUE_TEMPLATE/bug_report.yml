name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, `.env` contents, database URLs, API keys, or private chat text.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe set of steps that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mimir version or commit
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js version and operating system
      placeholder: Node 20.20.2 on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant output from `mimir doctor`, with sensitive values removed.
